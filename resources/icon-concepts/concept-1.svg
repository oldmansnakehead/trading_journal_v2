<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a30" />
      <stop offset="50%" stop-color="#0f111f" />
      <stop offset="100%" stop-color="#090a13" />
    </linearGradient>

    <!-- Squircle Border Glow -->
    <linearGradient id="borderGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7371f7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#4543db" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>

    <!-- Purple Candle Gradient -->
    <linearGradient id="candlePurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9d9cf9" />
      <stop offset="100%" stop-color="#5552ea" />
    </linearGradient>

    <!-- Green Bullish Candle Gradient -->
    <linearGradient id="candleGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Trend Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- macOS Standard Squircle Canvas (824x824 inside 1024x1024) -->
  <rect x="100" y="100" width="824" height="824" rx="190" ry="190" fill="url(#bgGrad1)" />
  <rect x="100" y="100" width="824" height="824" rx="190" ry="190" fill="none" stroke="url(#borderGrad1)" stroke-width="4" />

  <!-- Inner Soft Radial Ambient Glow -->
  <circle cx="512" cy="480" r="320" fill="#7371f7" opacity="0.12" filter="blur(60px)" />

  <g filter="url(#dropShadow)">
    <!-- Base Journal Ledger Plate -->
    <rect x="250" y="690" width="524" height="28" rx="14" fill="#252945" />
    <!-- Journal Ribbon / Accent Rule -->
    <rect x="250" y="690" width="180" height="28" rx="14" fill="#7371f7" opacity="0.6" />

    <!-- Trajectory Trend Line -->
    <path d="M 280 620 C 370 560, 470 500, 670 280" fill="none" stroke="#7371f7" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round" opacity="0.45" />

    <!-- Candle 1 (Left - Indigo/Periwinkle) -->
    <!-- Wick -->
    <line x1="390" y1="440" x2="390" y2="650" stroke="#7371f7" stroke-width="12" stroke-linecap="round" />
    <!-- Body -->
    <rect x="345" y="480" width="90" height="130" rx="20" fill="url(#candlePurple)" />

    <!-- Candle 2 (Center-Right - Higher Bullish Green) -->
    <!-- Wick -->
    <line x1="570" y1="260" x2="570" y2="580" stroke="#10b981" stroke-width="12" stroke-linecap="round" />
    <!-- Body -->
    <rect x="525" y="320" width="90" height="200" rx="20" fill="url(#candleGreen)" />

    <!-- Floating Target Star / Edge Node -->
    <circle cx="700" cy="250" r="16" fill="#34d399" filter="url(#softGlow)" />
    <circle cx="700" cy="250" r="8" fill="#ffffff" />
  </g>
</svg>