<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background: Deep Midnight Slate -->
    <linearGradient id="lineBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14172b" />
      <stop offset="60%" stop-color="#0c0e1a" />
      <stop offset="100%" stop-color="#07080f" />
    </linearGradient>

    <!-- Squircle Monoline Rim -->
    <linearGradient id="lineRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7371f7" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4" />
    </linearGradient>

    <!-- Trajectory Arc Gradient -->
    <linearGradient id="arcLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#c7d2fe" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="1" />
    </linearGradient>

    <!-- Stroke Shadow -->
    <filter id="strokeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Canvas (macOS / Windows safe area) -->
  <rect x="100" y="100" width="824" height="824" rx="190" ry="190" fill="url(#lineBgGrad)" />
  <rect x="100" y="100" width="824" height="824" rx="190" ry="190" fill="none" stroke="url(#lineRimGrad)" stroke-width="4" />

  <!-- Subtle Ambient Dome Glow -->
  <circle cx="512" cy="480" r="300" fill="#6366f1" opacity="0.08" />

  <g filter="url(#strokeGlow)">
    <!-- 1. Journal Ledger Lines (Minimalist Book Spine & Page Horizon) -->
    <!-- Lower Ledger Bar -->
    <path d="M 260 700 L 485 700 L 512 680 L 539 700 L 764 700" 
          fill="none" stroke="#4338ca" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
    
    <!-- Secondary Horizon Line -->
    <line x1="310" y1="736" x2="714" y2="736" stroke="#252849" stroke-width="10" stroke-linecap="round" />

    <!-- Bookmark Ribbon (Line Art) -->
    <path d="M 512 680 L 512 770 L 522 760" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 2. Trajectory Arc (Ascending Line) -->
    <path d="M 270 630 C 370 560, 470 480, 690 250" 
          fill="none" stroke="url(#arcLineGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 12" opacity="0.5" />

    <!-- 3. Candle 1 (Left - Violet Monoline) -->
    <!-- Upper & Lower Wicks -->
    <line x1="375" y1="410" x2="375" y2="470" stroke="#818cf8" stroke-width="14" stroke-linecap="round" />
    <line x1="375" y1="600" x2="375" y2="660" stroke="#818cf8" stroke-width="14" stroke-linecap="round" />
    <!-- Hollow Body Outline -->
    <rect x="330" y="470" width="90" height="130" rx="20" 
          fill="#6366f1" fill-opacity="0.08" stroke="#818cf8" stroke-width="16" />

    <!-- 4. Candle 2 (Right - Mint Monoline - Higher Breakout) -->
    <!-- Upper & Lower Wicks -->
    <line x1="575" y1="230" x2="575" y2="310" stroke="#6ee7b7" stroke-width="16" stroke-linecap="round" />
    <line x1="575" y1="520" x2="575" y2="640" stroke="#10b981" stroke-width="14" stroke-linecap="round" />
    <!-- Hollow Body Outline -->
    <rect x="530" y="310" width="90" height="210" rx="20" 
          fill="#10b981" fill-opacity="0.08" stroke="#34d399" stroke-width="16" />

    <!-- 5. Apex Target Node (Line Art Ring) -->
    <circle cx="690" cy="250" r="18" fill="none" stroke="#34d399" stroke-width="10" />
    <circle cx="690" cy="250" r="6" fill="#ffffff" />

    <!-- 6. Minimal Coordinate / Ledger Marks on Left -->
    <line x1="260" y1="460" x2="285" y2="460" stroke="#4338ca" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <line x1="250" y1="520" x2="285" y2="520" stroke="#4338ca" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <line x1="260" y1="580" x2="285" y2="580" stroke="#4338ca" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>