<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141629" />
      <stop offset="100%" stop-color="#090a12" />
    </linearGradient>

    <!-- T-Bar Gradient -->
    <linearGradient id="tBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#605dfa" />
      <stop offset="100%" stop-color="#9392ff" />
    </linearGradient>

    <!-- Stem / Candle Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8e8cfd" />
      <stop offset="50%" stop-color="#605dfa" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="100" y="100" width="824" height="824" rx="190" ry="190" fill="url(#bgGrad2)" />
  <rect x="100" y="100" width="824" height="824" rx="190" ry="190" fill="none" stroke="url(#borderGrad2)" stroke-width="4" />

  <!-- Ambient Glow -->
  <circle cx="512" cy="480" r="280" fill="#605dfa" opacity="0.15" />

  <g filter="url(#shadow2)">
    <!-- Upper Wick of T (Candlestick wick) -->
    <line x1="512" y1="210" x2="512" y2="330" stroke="#8e8cfd" stroke-width="16" stroke-linecap="round" />

    <!-- Top Horizontal Bar of 'T' (Journal Ledger Bar) -->
    <rect x="270" y="310" width="484" height="84" rx="42" fill="url(#tBarGrad)" />

    <!-- Vertical Candle Body (Stem of 'T') -->
    <rect x="458" y="350" width="108" height="260" rx="36" fill="url(#stemGrad)" />

    <!-- Bottom Hook representing 'J' (Journal) & Lower Wick -->
    <path d="M 512 610 L 512 680 C 512 730, 560 760, 620 740 C 655 728, 675 695, 675 660" 
          fill="none" stroke="#10b981" stroke-width="20" stroke-linecap="round" />

    <!-- Left side subtle journal note lines -->
    <rect x="300" y="470" width="80" height="12" rx="6" fill="#ffffff" opacity="0.2" />
    <rect x="300" y="520" width="110" height="12" rx="6" fill="#ffffff" opacity="0.2" />
    <rect x="300" y="570" width="60" height="12" rx="6" fill="#ffffff" opacity="0.2" />
  </g>
</svg>