<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGradMono" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121424" />
      <stop offset="100%" stop-color="#080911" />
    </linearGradient>

    <linearGradient id="rimGradMono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="190" ry="190" fill="url(#bgGradMono)" />
  <rect x="100" y="100" width="824" height="824" rx="190" ry="190" fill="none" stroke="url(#rimGradMono)" stroke-width="3" />

  <!-- Single Grid Reference Line -->
  <line x1="220" y1="512" x2="804" y2="512" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Journal Base Line -->
  <path d="M 270 690 L 485 690 L 512 665 L 539 690 L 754 690" 
        fill="none" stroke="#7371f7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Trajectory Arc -->
  <path d="M 280 630 C 370 560, 480 470, 700 240" 
        fill="none" stroke="#a5b4fc" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 12" stroke-opacity="0.6" />

  <!-- Candle 1 (Line Art) -->
  <line x1="380" y1="410" x2="380" y2="650" stroke="#7371f7" stroke-width="14" stroke-linecap="round" />
  <rect x="335" y="470" width="90" height="130" rx="18" fill="#121424" stroke="#7371f7" stroke-width="18" />

  <!-- Candle 2 (Line Art - Rising) -->
  <line x1="580" y1="230" x2="580" y2="610" stroke="#10b981" stroke-width="14" stroke-linecap="round" />
  <rect x="535" y="310" width="90" height="210" rx="18" fill="#121424" stroke="#10b981" stroke-width="18" />

  <!-- Target Node -->
  <circle cx="700" cy="240" r="16" fill="none" stroke="#10b981" stroke-width="10" />
  <circle cx="700" cy="240" r="6" fill="#10b981" />
</svg>