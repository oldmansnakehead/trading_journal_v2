<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background: Sleek Dark Midnight Canvas -->
    <linearGradient id="bgSimple1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131526" />
      <stop offset="100%" stop-color="#090a13" />
    </linearGradient>

    <!-- Subtle Border Stroke -->
    <linearGradient id="borderSimple1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- macOS / Windows Standard Squircle -->
  <rect x="100" y="100" width="824" height="824" rx="190" ry="190" fill="url(#bgSimple1)" />
  <rect x="100" y="100" width="824" height="824" rx="190" ry="190" fill="none" stroke="url(#borderSimple1)" stroke-width="3" />

  <!-- 1. Clean Ledger Baseline (เส้นฐานสมุดบันทึกเส้นตรง เรียบกริบ) -->
  <line x1="280" y1="700" x2="744" y2="700" stroke="#373b5e" stroke-width="18" stroke-linecap="round" />

  <!-- 2. Candle 1 (Left - Indigo/Periwinkle Line) -->
  <!-- Wick -->
  <line x1="410" y1="410" x2="410" y2="640" stroke="#7371f7" stroke-width="16" stroke-linecap="round" />
  <!-- Body -->
  <rect x="360" y="470" width="100" height="120" rx="20" fill="#131526" stroke="#7371f7" stroke-width="18" />

  <!-- 3. Candle 2 (Right - Emerald Mint Line - Rising) -->
  <!-- Wick -->
  <line x1="614" y1="260" x2="614" y2="640" stroke="#10b981" stroke-width="16" stroke-linecap="round" />
  <!-- Body -->
  <rect x="564" y="330" width="100" height="190" rx="20" fill="#131526" stroke="#10b981" stroke-width="18" />
</svg>