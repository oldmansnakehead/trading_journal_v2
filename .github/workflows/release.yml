name: Release Application

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_option:
        description: 'Publish option (always or onTagOrDraft)'
        required: true
        default: 'always'
        type: choice
        options:
          - always
          - onTagOrDraft

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check TypeScript Types
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Build and Publish Installer to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish ${{ github.event.inputs.publish_option || 'always' }}
